# Drop this in as .github/workflows/secrets-scan.yml in any repo produced by the
# isconl-agent split. Runs on every push and PR, regardless of which machine or
# Claude/human account made the commit -- enforcement lives in the repo, not in
# any one session's discipline.
name: secrets-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history available locally, so any log-opts range below always resolves
      # NOT gitleaks/gitleaks-action@v2 -- that wraps the CLI in a hosted
      # dashboard integration that requires a paid GITLEAKS_LICENSE for any
      # GitHub *organization* repo (isconl is an org), and fails outright
      # without one ("[isconl] is an organization. License key is
      # required."), regardless of whether the code is clean. The gitleaks
      # CLI itself is free/open-source (AGPL) with no such gate -- installed
      # and run directly here, sidestepping the Action's license wall
      # entirely while keeping identical detection.
      - name: gitleaks
        env:
          EVT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # (grep -m1 closing the pipe early makes curl print a harmless
          # "Failure writing output to destination" to stderr -- silenced
          # since it doesn't affect $VERSION, which is already captured by
          # the time that happens.)
          VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest 2>/dev/null | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks

          # Scoped to only the commits THIS push/PR actually introduces, not
          # the repo's entire history. This fleet's own repos have been
          # observed getting their history rewritten (rebase/squash/
          # force-push) by something outside any one session's control --
          # a full-history scan makes .gitleaksignore's commit-hash-keyed
          # fingerprints go stale on every rewrite (the hash half of the
          # fingerprint changes even when the flagged line's content
          # doesn't), which was silently re-flagging the exact same
          # already-reviewed false positives on every single push forever.
          # Scanning only the new range sidesteps that failure mode
          # entirely, is far faster, and matches what actually matters for
          # CI anyway: catching a secret THIS push introduces, not
          # re-relitigating history nobody touched.
          if [ "$EVT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            # First push to a new branch, or a force-push GitHub can't
            # compute a real "before" for -- scan just the tip commit
            # rather than the whole history.
            RANGE="-1"
          fi

          ./gitleaks detect --source . --log-opts="$RANGE" --redact -v --exit-code 1
        # Fails the check (blocks merge if branch protection requires it) on any finding.
        # --redact keeps a real finding's actual secret value out of the log even
        # while reporting where it was found.

  # Second job: a small custom pattern list for things gitleaks' generic rules
  # miss -- hardcoded personal identifiers, not secret-shaped but exactly what
  # this project needs blocked (names/places/tenant-specific IDs baked into code).
  identity-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded identity markers
        run: |
          # Deliberately narrow: only strings that are UNAMBIGUOUSLY one
          # specific person (a full name, an email address) -- not bare
          # common first names or ordinary English words. An earlier
          # version of this list included single first names (sam/alex/
          # casey/riley/taylor) copied from a real violation found in a
          # DIFFERENT, older codebase (the isconl-agent monolith's
          # abandoned isconl/ Python package, which branched logic on
          # those names literally). Applied blindly to every new repo,
          # those same words false-positive constantly on ordinary test
          # fixtures and doc-comment prose -- not a real leak, just a
          # common word. "operator" (a fleet-wide placeholder git identity,
          # `user.name=Operator`/`user.email=operator@example.com`, used
          # so commits never carry a real name) hit the exact same trap
          # 4 Sep 2026 -- it's also an ordinary English word this codebase
          # uses constantly in comments/docs to mean "the person running
          # this," with zero connection to the placeholder identity the
          # pattern was actually trying to catch. Removed for the same
          # reason the first-name list was trimmed. If a repo-specific
          # violation like that shows up again, add it back scoped to that
          # repo, not as a blanket rule everyone else inherits.
          # --exclude on this workflow file itself: the PATTERN definition
          # below literally contains the strings it's searching for, so
          # without the exclude this check permanently fails against its
          # own source (found the hard way -- every repo's first run failed
          # on .github/workflows/secrets-scan.yml matching itself).
          # KI26091201, 12 Sep 2026 -- TIGHTENED after a real disclosure.
          #
          # What went wrong: this check's entire PATTERN was one email address.
          # Its own comment above says it should catch "a full name, an email
          # address" -- but full names were never actually added. So when a
          # tenant-specific archetype landed on 15 Aug 2026 carrying a real
          # third-party's full name, a reference to a private conversation with
          # him, the engagement name as a DIRECTORY name, two of that client's
          # real site IDs and their network structure, this check passed
          # cleanly. It was public for four weeks.
          #
          # Note the trap that caused the under-tightening, because it is real
          # and the fix must not walk back into it: bare first names
          # (sam/alex/casey) and ordinary words ("operator") false-positive
          # constantly on test fixtures and doc prose. The categories below are
          # deliberately chosen to be UNAMBIGUOUS -- a full name, a real email
          # domain, a tenant id, a personal storage path. No bare given names.
          #
          # Tenant identifiers are repo-scoped on purpose, exactly as the note
          # above recommends: add a repo's own violation here, never as a
          # blanket rule every other repo inherits.
          # Any line may opt out with a trailing `identity-allow` comment. That
          # exists for exactly one legitimate case: a test that ASSERTS a name
          # is absent from output necessarily contains the name. Use it there
          # and essentially nowhere else -- it is an escape hatch, not a mute.
          #
          # Case sensitivity is split deliberately, and getting this wrong is
          # how the first draft of this tightening failed its own review: run
          # case-INSENSITIVELY, `[A-Z][a-z]+` matches lowercase, so the
          # full-name pattern degrades into "any known first name followed by
          # any word" and fires on ordinary prose like "the one Sconl is
          # actually using". Identifiers are matched case-insensitively;
          # full names are matched case-SENSITIVELY.
          CI_PATTERNS=(
            # -- real email domains (example.com/test/localhost stay allowed) --
            '[A-Za-z0-9._%+-]+@(proton\.me|acexoft\.com|gmail\.com|outlook\.com|hotmail\.com)'
            # -- tenant / client identifiers this repo must stay free of --
            '\bviva[-_ ]?valentia\b'
            '\bwamca\b'
            '\bapma\b'
          )
          CS_PATTERNS=(
            # -- personal cloud-storage roots (owner folder structure) --
            'Sconl/(Core|Crate|Circle)/'
            # -- full names: capitalised "Known Surname" only --
            '\b(Sconl|Swen|Joel|Patric|Evans)[[:space:]]+[A-Z][a-z]+'
          )
          FOUND=0
          scan() { # $1 = grep flags, $2 = pattern
            if grep -rIn $1 -E "$2" --exclude-dir=.git --exclude-dir=node_modules --exclude=secrets-scan.yml . \
                 | grep -v 'identity-allow'; then
              echo "::error::Hardcoded identity marker matched /$2/ -- see matches above."
              FOUND=1
            fi
          }
          for P in "${CI_PATTERNS[@]}"; do scan "-i" "$P"; done
          for P in "${CS_PATTERNS[@]}"; do scan ""   "$P"; done
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::This repo is PUBLIC and must stay tenant-agnostic. Move the value to config or the vault and read it from the environment -- never commit it to source."
            exit 1
          fi

      # KI26091201: a credential embedded in a remote URL is invisible to every
      # tracked-file scanner, including gitleaks and the step above, because
      # .git/config is not a tracked file. That blind spot let a live GitHub PAT
      # sit in plaintext in `remote.origin.url` on the deployment host and leak
      # through nothing more exotic than `git remote -v` -- twice, seven days
      # apart. Checked here so at least CI asserts the invariant; it cannot see
      # the deployment host's own config, so it is a backstop and not a cure.
      # The real fix is SSH remotes or a credential helper, never an embedded
      # token: with a token in the URL, disclosure is the DEFAULT behaviour of
      # ordinary diagnostics rather than something a person has to get wrong.
      - name: Check for credentials embedded in git remote URLs
        run: |
          if git config --get-regexp '^remote\..*\.url' | grep -Ei '://[^/@[:space:]]+@'; then
            echo "::error::A remote URL contains embedded credentials (user:token@host). Re-point it to SSH or a credential helper and rotate the exposed token immediately."
            exit 1
          fi
          echo "No credentials embedded in remote URLs."
